name: build image base

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      tag:
        required: true
        type: string
      context:
        required: true
        type: string

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set image variables
        id: vars
        run: |
          echo "IMAGE=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
          echo "TAG=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "CONTEXT=${{ inputs.context }}" >> "$GITHUB_OUTPUT"

      - name: Verify README entry
        run: python3 .github/workflows/check_readme_image.py --image "${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.TAG }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: "${{ steps.vars.outputs.CONTEXT }}"
          build-contexts: |
            shared=./shared
          tags: "${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.TAG }}"

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ steps.vars.outputs.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
