name: build evindunn/poetry

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-image.yml'
      - 'scripts/**'
      - 'shared/**'
      - '.github/workflows/poetry.yml'
      - 'poetry/**'
  workflow_dispatch: {}

concurrency:
  group: 'image-build-evindunn-poetry-latest'
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      image: evindunn/poetry
      tag: latest
      context: poetry
    secrets: inherit
