name: build evindunn/chronyd:latest

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-image-base.yml'
      - '.github/workflows/check_readme_image.py'
      - 'shared/**'
      - '.github/workflows/chronyd.yml'
      - 'chronyd/**'
  workflow_dispatch: {}

jobs:
  build:
    uses: ./.github/workflows/build-image-base.yml
    with:
      image: evindunn/chronyd
      tag: latest
      context: chronyd
    secrets: inherit
