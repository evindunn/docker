name: build evindunn/python3

on:
  push:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'python3/**'
  workflow_dispatch: {}

concurrency:
  group: 'image-build-evindunn-python3-latest'
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      image: evindunn/python3
      tag: latest
      context: python3
    secrets: inherit

  build_children:
    needs: build
    uses: ./.github/workflows/build-image-children.yml
    with:
      image: evindunn/python3
      tag: latest
