name: build image base

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      tag:
        required: true
        type: string
      context:
        required: true
        type: string

jobs:
  wait_for_parent_image:
    uses: ./.github/workflows/wait-for-parent-image.yml
    with:
      context: ${{ inputs.context }}

  push_to_registry:
    name: Push Docker image to Docker Hub
    needs: wait_for_parent_image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          cache-from: |
            type=gha,scope=${{ inputs.image }}
            type=registry,ref=${{ inputs.image }}:${{ inputs.tag }}
          cache-to: type=gha,scope=${{ inputs.image }},mode=max
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          context: '${{ inputs.context }}'
          build-contexts: |
            shared=./shared
          tags: '${{ inputs.image }}:${{ inputs.tag }}'

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
