name: sync README images

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

  workflow_dispatch: {}

concurrency:
  group: 'sync-readme-images-main'
  cancel-in-progress: false

jobs:
  sync:
    name: Update README image table
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install ai-tooling
        run: >-
          python3 -m pip install ai-tooling==0.0.3

      - name: Generate README descriptions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python3 .codex/skills/workflow-image-readme-sync/scripts/generate_readme_image_descriptions.py
          --output "${{ runner.temp }}/readme-image-descriptions.json"

      - name: Update README table
        run: >-
          python3 .codex/skills/workflow-image-readme-sync/scripts/update_readme.py
          --description-file "${{ runner.temp }}/readme-image-descriptions.json"

      - name: Detect README changes
        id: readme_changes
        run: |
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit README update
        if: steps.readme_changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: sync README image table'
          git push
