name: build evindunn/debian:trixie-slim

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-image.yml'
      - '.github/workflows/build-image-children.yml'
      - '.github/workflows/debian-trixie-slim.yml'
      - 'debian-trixie-slim/**'
      - 'scripts/**'
      - 'shared/**'
  workflow_dispatch: {}

jobs:
  target:
    name: Set target image metadata
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.target.outputs.image }}
      tag: ${{ steps.target.outputs.tag }}
      full_slug: ${{ steps.target.outputs.full_slug }}
    steps:
      - name: Set target image metadata
        id: target
        run: |
          echo 'image=evindunn/debian' >> "$GITHUB_OUTPUT"
          echo 'tag=trixie-slim' >> "$GITHUB_OUTPUT"
          echo 'full_slug=evindunn/debian:trixie-slim' >> "$GITHUB_OUTPUT"

  build:
    needs: target
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ needs.target.outputs.image }}
      tag: ${{ needs.target.outputs.tag }}
      context: debian-trixie-slim
    secrets: inherit

  build_children:
    needs:
      - target
      - build
    uses: ./.github/workflows/build-image-children.yml
    with:
      parent_image: ${{ needs.target.outputs.full_slug }}
