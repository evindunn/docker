name: build evindunn/vault-agent:latest

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-image.yml'
      - 'shared/**'
      - '.github/workflows/vault-agent.yml'
      - 'vault-agent/**'
  workflow_dispatch: {}

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-build]') }}
    uses: ./.github/workflows/build-image.yml
    with:
      image: evindunn/vault-agent
      tag: latest
      context: vault-agent
    secrets: inherit
